# Redmi Note 7 (lavender), sensor s5kgm1. Matriz medida com a carta de 24 cores na tela de um notebook (17/11/2026).
%YAML 1.1
---
version: 1
algorithms:
  - Af:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 2.3736, -0.9432, -0.4304, -0.4180, 2.2887, -0.8707, -0.0358, -1.0850, 2.1208 ]
  - Adjust:
  - Agc:
      # Sem CameraSensorHelper para este sensor, o ganho fica no código do
      # registrador. Primeiro sobe o ganho até 4x com 1/30 s; só depois
      # alonga o quadro (1/15 s, 1/10 s).
      AeExposureMode:
        ExposureNormal:
          exposureTime: [ 33333, 66666, 100000 ]
          gain: [ 128, 256, 512 ]
...
